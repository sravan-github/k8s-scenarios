# Scenario 6: HTTPS Ingress with automatic certificates.
# Prerequisites: an ingress-nginx controller and cert-manager with a ClusterIssuer
# named "letsencrypt-prod". Replace app.example.com with your DNS name.
# Optionally change app-service to `type: ClusterIP` so traffic only enters via the Ingress.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app-demo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com
      secretName: app-tls            # created by cert-manager
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 80

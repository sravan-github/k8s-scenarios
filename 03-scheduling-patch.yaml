# Scenario 3: Spread app pods across nodes (and zones, where the cluster has them).
# This is a strategic-merge patch for the existing Deployment:
#   kubectl patch deployment app -n app-demo --patch-file scenarios/03-scheduling-patch.yaml
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nodeapp
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nodeapp
      affinity:
        # Prefer to run next to the database to reduce latency
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app: postgres
